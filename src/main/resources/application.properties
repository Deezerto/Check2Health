spring.application.name=check2health

# --- MySQL DataSource ---
spring.datasource.url=jdbc:mysql://localhost:3306/check2health?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=c2h_user
spring.datasource.password=StrongPass123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# --- Spring Mail (for password reset) ---
# Using a common port for local SMTP test servers like MailHog.
# The DEBUG log level ensures that email sending attempts are visible in the console.
spring.mail.host=localhost
spring.mail.port=1025
logging.level.org.springframework.mail=DEBUG
